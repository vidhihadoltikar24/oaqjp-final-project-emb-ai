apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean up temporary files and workspace.
  workspaces:
    - name: source
  steps:
    - name: remove-temp-files
      image: alpine:3.19
      script: |
        #!/bin/sh
        echo "Starting cleanup task..."
        rm -rf "$(workspaces.source.path)/.pytest_cache"
        rm -rf "$(workspaces.source.path)/__pycache__"
        echo "Cleanup completed successfully."

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  description: Run Python unit tests using Nose.
  workspaces:
    - name: source
  steps:
    - name: run-nose-tests
      image: python:3.10-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        echo "Installing Nose..."
        pip install nose
        echo "Running unit tests..."
        nosetests
        echo "Unit tests completed successfully."
